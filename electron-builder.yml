appId: com.integerstudios.codr
productName: Codr

publish:
  provider: github
  owner: qrcf
  repo: codr
  releaseType: draft

directories:
  output: dist
  buildResources: build

files:
  - out/**/*

extraResources:
  - from: resources/crawl4ai
    to: crawl4ai
  - from: resources/indexer
    to: indexer
  - from: resources/bin
    to: bin

asarUnpack:
  - "node_modules/@anthropic-ai/claude-agent-sdk/**"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true

linux:
  category: Development
  icon: build/icons
  maintainer: Quinn Finney <quinn@finney.id>
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

dmg:
  sign: true
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
  title: "Install Codr"

protocols:
  - name: Codr Protocol
    schemes:
      - codr
